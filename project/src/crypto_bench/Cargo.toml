[package]
name = "crypto_bench"
version = "0.1.0"
edition = "2021"
description = "CP6: single-thread CPU cost of the crypto a community node box runs on every post"

[features]
# CP7: the x86-64 assembly field multiplication (build with RUSTFLAGS="-C target-cpu=native")
fast = ["ark-ff/asm"]

[dependencies]
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ark-relations = "0.5"
ark-snark = "0.5"
ark-groth16 = { version = "0.5", default-features = false }
ed25519-dalek = { version = "2.1", features = ["batch", "rand_core"] }
chacha20poly1305 = "0.10"
rand = "0.8"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
