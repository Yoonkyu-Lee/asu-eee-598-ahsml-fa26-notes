# GitHub Pages는 이 docs/ 폴더만 Jekyll로 빌드한다 (Pages 소스: main 브랜치 /docs).
# 저장소 루트의 hw/, project/, scripts/, papers/ 등은 애초에 빌드 대상이 아니다.
# 노트 HTML은 그대로 복사되지만, 설정이 없으면 .md 파일까지 웹페이지로 변환해서 공개한다.
#
# 주의 1: exclude를 지정하면 Jekyll의 기본 제외 목록을 덮어쓴다.
#         기본값(node_modules, vendor/bundle 등)도 같이 적어야 한다.
# 주의 2: assets/vendor/ 를 통째로 빼면 안 된다. assets/vendor/pdf.js/ 가 리더 런타임이라
#         빼는 순간 슬라이드가 안 뜬다.

exclude:
  # docs/ 안에 실수로 들어와도 공개하지 않을 것
  - CLAUDE.md
  - WHAT TO DO.md

  # Jekyll 기본 제외 목록 (덮어쓰기 때문에 다시 적어야 한다)
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package-lock.json
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
